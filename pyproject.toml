[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-nsde-building-thermal"
version = "0.1.0"
description = "Physics-informed neural SDE in JAX that estimates building thermal capacity and envelope resistance from thermostat and weather time series, with Laplace UQ."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.31",
    "jaxlib>=0.4.31",
    "optax>=0.2.2",
    "numpy>=1.24",
    "matplotlib>=3.8",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/smyng91/pi-nsde-building-thermal"
Repository = "https://github.com/smyng91/pi-nsde-building-thermal"

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
pi-nsde-building-thermal = "pi_nsde_building_thermal.example:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
